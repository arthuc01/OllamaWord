<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ollama Word</title>
    <link rel="stylesheet" href="./taskpane.css" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <h2>Transform selected text</h2>

        <label for="action-select">Action</label>
        <select id="action-select"></select>

        <details class="options">
          <summary>Model and settings</summary>

          <label for="model-select">Ollama model</label>
          <div class="model-row">
            <select id="model-select"></select>
            <button id="reload-models-button" type="button">Reload</button>
          </div>

          <label for="target-length-select">Target length</label>
          <select id="target-length-select">
            <option value="similar">Similar</option>
            <option value="shorter">Shorter</option>
            <option value="longer">Longer</option>
          </select>

          <label for="tone-select">Tone</label>
          <select id="tone-select">
            <option value="neutral">Neutral</option>
            <option value="formal">Formal</option>
            <option value="friendly">Friendly</option>
            <option value="academic">Academic</option>
            <option value="plain">Plain</option>
          </select>
        </details>

        <button id="run-button" class="primary" type="button">Apply to highlighted text</button>
        <div id="selection-count" class="count">No selection read yet.</div>
      </section>

      <section class="panel">
        <h2>Write at cursor</h2>

        <label for="custom-prompt">Prompt</label>
        <textarea id="custom-prompt" placeholder="Example: Write a short paragraph about subject X."></textarea>

        <button id="write-at-cursor-button" class="primary" type="button">Generate and insert at cursor</button>
      </section>

      <section class="panel">
        <h2>Output preview</h2>
        <textarea id="output-text" placeholder="The generated text will appear here."></textarea>

        <div class="button-grid">
          <button id="replace-button" type="button">Replace selection</button>
          <button id="insert-button" type="button">Insert below</button>
          <button id="copy-button" type="button">Copy output</button>
          <button id="run-again-button" type="button">Run again</button>
        </div>
      </section>

      <section class="status-area" aria-live="polite">
        <div id="spinner" class="spinner hidden"></div>
        <div id="status-message">Loading models...</div>
      </section>
    </main>

    <script type="module" src="./taskpane.ts"></script>
  </body>
</html>
